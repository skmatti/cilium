prow_ignored:
- &pod-resources
  requests:
    memory: "32Gi"
    cpu: 2
    ephemeral-storage: "150Gi"
  limits:
    memory: "32Gi"
    cpu: 4
    ephemeral-storage: "300Gi"
presubmits:
# Presubmit WORA jobs.
- name: wora-bme2e_cilium
  trigger: /test wora-bme2e$
  rerun_command: /test wora-bme2e
  always_run: false
  skip_fetch_head: true
  decorate: true
  decoration_config:
    timeout: 240m
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
    prow.k8s.io/pubsub.project: "anthos-networking-ci"
    prow.k8s.io/pubsub.runID: "prow-etl-presubmit-tests"
    prow.k8s.io/pubsub.topic: "prow-etl-trigger"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird@sha256:dd6edb7b068410208ae185e780bfef1629ea5e07ce566c17132edb1070a71d0d
      resources:
        <<: *pod-resources
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: HEAD
      - name: PATCH_CONTENT_DIR
        value: addon/patch_content/abm-1.32.x-gke/overlays/gdc-so
      - name: TBCONFIG
        value: sut-bme2e.yaml
      - name: WORA_CONFIG
        value: no_op_test.yaml
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
