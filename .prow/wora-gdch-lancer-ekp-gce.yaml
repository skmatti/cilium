presubmits:
- name: wora-gdch-abm-gce-lancer_cilium
  trigger: /test wora-gdch-abm-gce-lancer$
  rerun_command: /test wora-gdch-abm-gce-lancer
  always_run: false
  decorate: true
  decoration_config:
    timeout: 240m
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird:latest
      resources:
        requests:
          ephemeral-storage: 150Gi
        limits:
          ephemeral-storage: 300Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: HEAD
      - name: PATCH_CONTENT_DIR
        value: addon/patch_content/abm-1.32.0-gke.566/overlays/gdch-lancer
      - name: TBCONFIG
        value: sut-gdch-abm-gce.yaml
      - name: WORA_CONFIG
        value: integration-gdch-abm-gce_test.yaml
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
