        value: sut-gdch-lancer-abm-gce.yaml
      - name: WORA_CONFIG
        value: integration_test.yaml
      - name: WORA_GINKGO_LABEL_FILTER
        value: bpfprog||connectivity||egressnat||externallb||geneve||hostfirewall||internallb||l3vm||loadbalancer||multigateway_egressnat||sample||strict||tailcall
