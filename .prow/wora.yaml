presubmits:
# Presubmit WORA jobs.
- name: wora-abm-gce_cilium
  trigger: /test wora-abm-gce$
  rerun_command: /test wora-abm-gce
  always_run: false
  skip_fetch_head: true
  decorate: true
  decoration_config:
    timeout: 240m
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird:latest
      resources:
        requests:
          ephemeral-storage: 150Gi
        limits:
          ephemeral-storage: 300Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: HEAD
      - name: PATCH_CONTENT_DIR
        value: addon/patch_content/abm-1.32.x-gke/overlays/gdc-so
      - name: TBCONFIG
        value: sut-abm-gce.yaml
      - name: WORA_CONFIG
        value: integration_test.yaml
      - name: WORA_GINKGO_LABEL_FILTER
        # TODO: b/412356832 - reenable kubevirt verifier when the bug is fixed.
        # value: kubevirt||multinetwork||sample||tailcall
        value: multinetwork||sample||tailcall
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
