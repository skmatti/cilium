prow_ignored:
- &node-taint
  nodeSelector:
    prow-dedicated: wora-pvc
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: wora
- &pvc-template
  volumes:
    - name: prow-persistent-storage
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: "150Gi"
presubmits:
- name: wora-gdch_lancer_cilium
  cluster: anthos-networking-ci-us-west1-b
  trigger: /test wora-gdch-adhoc-lancer$
  rerun_command: /test wora-gdch-adhoc-lancer
  always_run: false
  skip_fetch_head: true
  decorate: true
  decoration_config:
    gcs_configuration:
      bucket: "anthos-networking-ci"
      path_strategy: "explicit"
    timeout: 12h
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-dind-enabled: "true"
    prow.k8s.io/pubsub.project: "anthos-networking-ci"
    prow.k8s.io/pubsub.runID: "prow-etl-presubmit-tests"
    prow.k8s.io/pubsub.topic: "prow-etl-trigger"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    <<: *node-taint
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird@sha256:dd6edb7b068410208ae185e780bfef1629ea5e07ce566c17132edb1070a71d0d
      resources:
        requests:
          ephemeral-storage: 150Gi
        limits:
          ephemeral-storage: 300Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: ADHOC_USERNAME
        value: an-shift-left-lancer-presubmit
      - name: CILIUM_GITREF
        value: HEAD
      - name: ENV_TEMPLATE_ID
        value: b82f9f61-ccbd-4871-9154-085eddc40012
      - name: GDCH_E2E_TEST_PLAN
        value: dynamic
      - name: GDCH_E2E_TESTS
        value: TestUNETReadyOrgInfra$|TestUNETReadyOrgMgmt$|TestUNETReadyOrgService$|TestUNETReadyVMUser$|TestOrgNetworkPolicyLancer$
      - name: OC_UPDATE_TEMPLATE
        value: cilium_lancer_update_spec.json.tmpl
      - name: TBCONFIG
        value: sut-gdch-adhoc.yaml
      - name: WORA_CONFIG
        value: no_op_test.yaml
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
      volumeMounts:
      - name: prow-persistent-storage
        mountPath: /var/lib/docker
    <<: *pvc-template
