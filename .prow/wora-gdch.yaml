presubmits:
- name: wora-gdch_legacy_cilium
  trigger: /test wora-gdch-adhoc-legacy$
  rerun_command: /test wora-gdch-adhoc-legacy
  always_run: false
  decorate: true
  decoration_config:
    timeout: 12h
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird:latest
      resources:
        requests:
          ephemeral-storage: 150Gi
        limits:
          ephemeral-storage: 300Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: HEAD
      - name: TBCONFIG
        value: sut-gdch-adhoc.yaml
      - name: OC_UPDATE_TEMPLATE
        value: cilium_129_update_spec.json.tmpl
      - name: ENV_TEMPLATE_ID
        value: c97a9292-975e-47f3-a290-a70df10edc4f
      - name: ADHOC_USERNAME
        value: an-shift-left-legacy-presubmit
      - name: GDCH_E2E_TESTS
        value: TestVMSetupV2MT$|TestVMCreateUbuntuVMV2MT$|TestUNETVMSetup$|TestConnectivityMultiTenant$|TestVMNetworkToVMInterProjectV2MT$|TestVMNetworkToVMIntraProjectV2MT$|TestVMEgressNATV2MT$|TestGdcloudNetworkDiagnoseMT$|TestClusterMeshConnectivityMultiTenant$|TestClusterMeshConnectivityNewFrameworkMultiTenant$|TestVMNetworkToPodIntraProjectV2MT$|TestFabricTracingMultiTenant$|TestILBServiceConnectivityMultiTenant$|TestProjectNetworkPolicyEnforcementMultiTenant$|TestEgressNATMultiTenant$|TestExternalLBMultiTenant$|TestClusterMeshHealthMultiTenant$|TestUNETReadyRootAdmin$|TestUNETReadyOrgAdmin$
      - name: GDCH_E2E_TEST_PLAN
        value: dynamic
      - name: WORA_CONFIG
        value: no_op_test.yaml
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
