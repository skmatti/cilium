presubmits:
# Presubmit WORA jobs.
- name: wora-gdce_cilium
  trigger: /test wora-gdce$
  rerun_command: /test wora-gdce
  always_run: false
  skip_fetch_head: true
  decorate: true
  decoration_config:
    timeout: 240m
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird:latest
      resources:
        requests:
          ephemeral-storage: 70Gi
        limits:
          ephemeral-storage: 100Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: v1.13-anthos1.29
      - name: TBCONFIG
        value: sut-gdce.yaml
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
- name: wora-conformance-gdce_cilium
  trigger: /test wora-conformance-gdce$
  rerun_command: /test wora-conformance-gdce
  always_run: false
  skip_fetch_head: true
  decorate: true
  decoration_config:
    timeout: 240m
  labels:
    preset-cookie-file: "true"
    preset-cookie-file-env: "true"
    preset-service-account: "true"
    preset-dind-enabled: "true"
    preset-k8s-ssh: "true"
  path_alias: gke-internal.googlesource.com/third_party/cilium
  spec:
    containers:
    - image: gcr.io/tailorbird/kubetest2-tailorbird:latest
      resources:
        requests:
          ephemeral-storage: 70Gi
        limits:
          ephemeral-storage: 100Gi
      securityContext:
        # needed for docker-in-docker
        privileged: true
      env:
      - name: CILIUM_GITREF
        value: v1.13-anthos1.29
      - name: DOCKER_BUILD_EXTRA_ARGS
        value: --build-arg=K8S_VERSION=v1.28.7
      - name: TBCONFIG
        value: sut-gdce.yaml
      - name: WORA_CONFIG
        value: conformance_gdce_test.yaml
      - name: WORA_DOCKERFILE_DIR
        value: conformance
      command:
      - runner.sh
      args:
      - ./google_test/wora/prow_entrypoint.sh
