apiVersion: sut.tailorbird.io/v1alpha1
kind: Rookery
metadata:
  name: integration-test-rookery
  namespace: tailorbird-users
spec:
  applications:
  - apiVersion: sut.tailorbird.io/v1alpha1
    kind: Application
    metadata:
      name: integration-test-rookery
      namespace: tailorbird-users
    spec:
      resourceTypeReference:
        name: anthos-networking-test-workloads
        version: latest
      directives:
      - apiVersion: sut.tailorbird.io/v1alpha1
        kind: ExecutionDirective
        metadata:
          name: integration-test-execution
        spec:
          targets:
          - namePrefix: oob1 # This should match prefix of cluster name in `--upload-external-clusters`
            kind: Cluster
            namespace: tailorbird-users
          - namePrefix: oob2
            kind: Cluster
            namespace: tailorbird-users
          args:
          - /test/ginkgo
          - --keep-going
          - --timeout=2h
          - --label-filter=sample
          - -vv
          - --no-color
          - --output-dir={{ RuntimePath "." }}
          - --junit-report=junit_results.xml
          - /test/e2e.test
          env:
            HTTP_PROXY_C1: '{{ ResourceVar ((Ref "Cluster" "oob1").Name) "HTTP_PROXY" }}'
            HTTPS_PROXY_C1: '{{ ResourceVar ((Ref "Cluster" "oob1").Name) "HTTPS_PROXY" }}'
            KUBECONFIG_C1: '{{ KubeconfigPath "user" ((Ref "Cluster" "oob1").Name) }}'
            HTTP_PROXY_C2: '{{ ResourceVar ((Ref "Cluster" "oob2").Name) "HTTP_PROXY" }}'
            HTTPS_PROXY_C2: '{{ ResourceVar ((Ref "Cluster" "oob2").Name) "HTTPS_PROXY" }}'
            KUBECONFIG_C2: '{{ KubeconfigPath "user" ((Ref "Cluster" "oob2").Name) }}'
            RESULTS_DIR: '{{ RuntimePath "." }}' # Write results to root of artifacts dir.
