apiVersion: networking.gke.io/v1alpha1
kind: NetworkLogging
metadata:
  name: default
spec:
  cluster:
    allow:
      delegate: false
      log: false
    deny:
      delegate: false
      log: false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkloggings.networking.gke.io
spec:
  group: networking.gke.io
  names:
    kind: NetworkLogging
    plural: networkloggings
    shortNames:
    - nl
    singular: networklogging
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkLogging describes the specification used by network logging.
        properties:
          metadata:
            properties:
              name:
                pattern: ^default$
                type: string
            type: object
          spec:
            description: Spec is the desired configuration for network logging.
            properties:
              cluster:
                description: Cluster specifies the log options for cluster-level network
                  logging.
                properties:
                  allow:
                    description: Allow specifies the log action for policy-allowed
                      connections.
                    properties:
                      delegate:
                        description: Delegate can only be true if Log is true. Log:false,
                          Delegate:true is invalid. If Delegate is true, logging will
                          be controlled by the annotation of matching network policies.
                        type: boolean
                      log:
                        description: Log specifies if logging is enabled or not. The
                          default value is false.
                        type: boolean
                    type: object
                  deny:
                    description: Deny specifies the log action for policy-denied connections.
                    properties:
                      delegate:
                        description: Delegate can only be true if Log is true. Log:false,
                          Delegate:true is invalid. If Delegate is true, logging will
                          be controlled by the annotation of the pod's namespace.
                        type: boolean
                      log:
                        description: Log specifies if logging is enabled or not. The
                          default value is false.
                        type: boolean
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
