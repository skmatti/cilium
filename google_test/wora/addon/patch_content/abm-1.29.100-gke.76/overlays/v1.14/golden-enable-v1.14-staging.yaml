---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k8s-app: cilium
  name: anetd
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      annotations:
        baremetal.cluster.gke.io/kube-proxy-free: "false"
        monitoring.gke.io/port: "9990"
        monitoring.gke.io/scrape: "true"
      labels:
        k8s-app: cilium
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: cilium
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
      - args:
        - --k8s-kubeconfig-path=/etc/kubernetes/kubelet.conf
        - --config-dir=$(CILIUM_CONFIG_MAP)
        command:
        - /run_cilium_agent.sh
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: CILIUM_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: MTU_DEVICE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: CILIUM_CONFIG_MAP
          value: /tmp/cilium/config-map
        - name: CILIUM_CLUSTERMESH_CONFIG
          value: /var/lib/cilium/clustermesh/
        - name: CILIUM_CNI_CHAINING_MODE
          valueFrom:
            configMapKeyRef:
              key: cni-chaining-mode
              name: cilium-config
              optional: true
        - name: CILIUM_CUSTOM_CNI_CONF
          valueFrom:
            configMapKeyRef:
              key: custom-cni-conf
              name: cilium-config
              optional: true
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            host: 127.0.0.1
            httpHeaders:
            - name: brief
              value: "true"
            path: /healthz
            port: 9876
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: cilium-agent
        ports:
        - containerPort: 9990
          hostPort: 9990
          name: prometheus
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            httpHeaders:
            - name: brief
              value: "true"
            path: /healthz
            port: 9876
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          privileged: true
        startupProbe:
          failureThreshold: 105
          httpGet:
            host: 127.0.0.1
            httpHeaders:
            - name: brief
              value: "true"
            path: /healthz
            port: 9876
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
          name: bpf-maps
        - mountPath: /var/run/cilium
          name: cilium-run
        - mountPath: /host/opt/cni/bin
          name: cni-path
        - mountPath: /host/etc/cni/net.d
          name: etc-cni-netd
        - mountPath: /var/lib/cilium/clustermesh
          name: clustermesh-secrets
          readOnly: true
        - mountPath: /tmp/cilium/config-map
          name: cilium-config-path
          readOnly: true
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /run/xtables.lock
          name: xtables-lock
        - mountPath: /var/log/network
          name: network-log
        - mountPath: /host/proc
          name: hostproc
          readOnly: true
        - mountPath: /host/var/run/netns
          mountPropagation: HostToContainer
          name: host-var-run-netns
          readOnly: true
        - mountPath: /run/dhcp
          name: dhcp-socket
        - mountPath: /var/lib/kubelet
          name: kubelet-dir
          readOnly: true
        - mountPath: /etc/kubernetes/kubelet.conf
          name: kubelet-kubeconfig
          readOnly: true
        - mountPath: /var/log/network/policy-logging.conf
          name: policy-logging-config
          subPath: policy-logging.conf
      - command:
        - /dhcpplugin
        - daemon
        image: gcr.io/anthos-baremetal-staging/anthos-networking/dhcp-plugin:v2.9.20@sha256:1ccdef03c44473cc38f859dd4bce9e0e3e4cfbb6bae538625386d2887d8530f4
        imagePullPolicy: IfNotPresent
        name: dhcp
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host/var/run/netns
          mountPropagation: HostToContainer
          name: host-var-run-netns
          readOnly: true
        - mountPath: /host/proc
          name: hostproc
          readOnly: true
        - mountPath: /run/dhcp
          name: dhcp-socket
        - mountPath: /var/run/dhcp
          name: dhcp-run
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -ec
        - |
          if [ "$KUBE_PROXY_REPLACEMENT" != "strict" ]; then
            kube_proxy_forward() { iptables -L KUBE-FORWARD; }
            until kube_proxy_forward; do sleep 2; done
          fi;
        env:
        - name: KUBE_PROXY_REPLACEMENT
          valueFrom:
            configMapKeyRef:
              key: kube-proxy-replacement
              name: cilium-config
              optional: true
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        name: check-kube-proxy-rules
        securityContext:
          privileged: true
      - command:
        - sh
        - -ec
        - |
          cp /usr/bin/cilium-mount /hostbin/cilium-mount;
          nsenter --cgroup=/hostproc/1/ns/cgroup --mount=/hostproc/1/ns/mnt "${BIN_PATH}/cilium-mount" $CGROUP_ROOT;
          rm /hostbin/cilium-mount
        env:
        - name: CGROUP_ROOT
          value: /run/cilium/cgroupv2
        - name: BIN_PATH
          value: /opt/cni/bin
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        name: mount-cgroup
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /hostproc
          name: hostproc
        - mountPath: /hostbin
          name: cni-path
      - command:
        - /init-container.sh
        env:
        - name: CILIUM_ALL_STATE
          valueFrom:
            configMapKeyRef:
              key: clean-cilium-state
              name: cilium-config
              optional: true
        - name: CILIUM_BPF_STATE
          valueFrom:
            configMapKeyRef:
              key: clean-cilium-bpf-state
              name: cilium-config
              optional: true
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        name: clean-cilium-state
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /sys/fs/bpf
          name: bpf-maps
        - mountPath: /run/cilium/cgroupv2
          mountPropagation: HostToContainer
          name: cilium-cgroup
        - mountPath: /var/run/cilium
          name: cilium-run
      - command:
        - sh
        - -ec
        - |
          cp /usr/bin/cilium-sysctlfix /hostbin/cilium-sysctlfix;
          nsenter --mount=/hostproc/1/ns/mnt "${BIN_PATH}/cilium-sysctlfix";
          rm /hostbin/cilium-sysctlfix
        env:
        - name: BIN_PATH
          value: /opt/cni/bin
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        name: apply-sysctl-overwrites
        securityContext:
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /hostproc
          name: hostproc
        - mountPath: /hostbin
          name: cni-path
      - command:
        - /install-plugin.sh
        image: gcr.io/anthos-baremetal-staging/cilium/cilium:v1.14.7-gke.10@sha256:2618a37fc7e576d1c802371c98f5d50e9fed062c9e914f563603626b436906cf
        imagePullPolicy: IfNotPresent
        name: install-cni-binaries
        securityContext:
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /host/opt/cni/bin
          name: cni-path
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      restartPolicy: Always
      terminationGracePeriodSeconds: 1
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /etc/kubernetes/kubelet.conf
          type: File
        name: kubelet-kubeconfig
      - hostPath:
          path: /var/run/cilium
          type: DirectoryOrCreate
        name: cilium-run
      - hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
        name: bpf-maps
      - hostPath:
          path: /proc
          type: Directory
        name: hostproc
      - hostPath:
          path: /run/cilium/cgroupv2
          type: DirectoryOrCreate
        name: cilium-cgroup
      - hostPath:
          path: /opt/cni/bin
          type: DirectoryOrCreate
        name: cni-path
      - hostPath:
          path: /etc/cni/net.d
          type: DirectoryOrCreate
        name: etc-cni-netd
      - hostPath:
          path: /lib/modules
        name: lib-modules
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
      - hostPath:
          path: /var/log/network
          type: DirectoryOrCreate
        name: network-log
      - hostPath:
          path: /var/run/netns
          type: DirectoryOrCreate
        name: host-var-run-netns
      - name: clustermesh-secrets
        secret:
          defaultMode: 256
          optional: true
          secretName: cilium-clustermesh
      - configMap:
          name: cilium-config
        name: cilium-config-path
      - hostPath:
          path: /var/run/gke-dhcp
          type: DirectoryOrCreate
        name: dhcp-run
      - emptyDir: {}
        name: dhcp-socket
      - configMap:
          items:
          - key: policy-logging.conf
            path: policy-logging.conf
          name: policy-logging-config
        name: policy-logging-config
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 2
    type: RollingUpdate
---
apiVersion: v1
data:
  policy-logging.conf: |
    maxLogRate: 500
kind: ConfigMap
metadata:
  name: policy-logging-config
  namespace: kube-system
---
apiVersion: v1
data:
  disable-network-policy-crd: "false"
  enable-cilium-network-policy: "false"
  tunnel-protocol: geneve
  tunnel: ""
  enable-l7-proxy: "false"
  enable-cilium-clusterwide-network-policy: "false"
kind: ConfigMap
metadata:
  name: cilium-config
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.cilium/app: operator
    name: cilium-operator
  name: anet-operator
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      io.cilium/app: operator
      name: cilium-operator
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        monitoring.gke.io/port: "6942"
        monitoring.gke.io/scrape: "true"
      labels:
        io.cilium/app: operator
        name: cilium-operator
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                io.cilium/app: operator
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --config-dir=/tmp/cilium/config-map
        - --debug=$(CILIUM_DEBUG)
        command:
        - cilium-operator-generic
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: CILIUM_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: CILIUM_DEBUG
          valueFrom:
            configMapKeyRef:
              key: debug
              name: cilium-config
              optional: true
        image: gcr.io/anthos-baremetal-staging/cilium/operator:v1.14.7-gke.10@sha256:6360c6e0378114869de30028b60c7a3c1097e06c8aa1441fcb593589de4a5b91
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 9234
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
        name: cilium-operator
        ports:
        - containerPort: 6942
          hostPort: 6942
          name: prometheus
          protocol: TCP
        resources:
          requests:
            cpu: 30m
            memory: 130Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /tmp/cilium/config-map
          name: cilium-config-path
          readOnly: true
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      restartPolicy: Always
      serviceAccount: cilium-operator
      serviceAccountName: cilium-operator
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: cilium-config
        name: cilium-config-path
